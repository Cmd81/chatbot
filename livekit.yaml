# ─────────────────────────────────────────────────────────────────────────────
#  LiveKit Server — SFU + TURN داخلی
#
#  ⚠️ کلیدهای API اینجا نوشته نمی‌شوند؛ از متغیر محیطی LIVEKIT_KEYS خوانده
#     می‌شوند (docker-compose آن را از فایل .env می‌سازد).
#
#  اگر دامنه‌ی شما فرق دارد، فقط مقدار turn.domain را عوض کنید.
# ─────────────────────────────────────────────────────────────────────────────

port: 7880

logging:
  level: info
  json: true

rtc:
  # فقط یک پورت UDP برای همه‌ی مدیاها (UDP mux) — ساده‌تر برای فایروال
  udp_port: 7882
  # مسیر جایگزین وقتی UDP در دسترس نیست
  tcp_port: 7881
  # آی‌پی عمومی سرور از طریق STUN کشف می‌شود.
  # اگر سرور پشت NAT است یا خروجی STUN بسته است، این خط را false کنید و
  # آی‌پی عمومی را در node_ip بنویسید.
  use_external_ip: true
  # node_ip: 203.0.113.10

turn:
  enabled: true
  domain: turn.onlane.top
  # TURN روی UDP برای حالت عادی
  udp_port: 3478
  # TLS توسط Caddy روی پورت عمومی 5349 ترمینیت می‌شود و ترافیک خام به این
  # پورت داخلی می‌آید. برای کاربران پشت VPN/فیلترینگ که UDP ندارند.
  external_tls: true
  tls_port: 5350
  # بازه‌ی پورت relay (باید در ufw باز باشد)
  relay_range_start: 50000
  relay_range_end: 60000

room:
  # اتاق‌ها توسط بک‌اند ساخته می‌شوند؛ auto_create فقط یک تور اطمینان است.
  auto_create: true
  empty_timeout: 60
  max_participants: 2
